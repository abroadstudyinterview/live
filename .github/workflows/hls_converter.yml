name: Generate HLS Stream

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante mein auto-update ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert MP4 to Looping HLS (.m3u8)
        run: |
          mkdir -p hls
          ffmpeg -stream_loop 5 -i stream.mp4 -codec: copy -start_number 0 -hls_time 10 -hls_list_size 0 -f hls hls/playlist.m3u8

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hls
